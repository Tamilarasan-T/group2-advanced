name: Reusable Security

on:
  workflow_call:
    inputs:
      scan-directory:
        description: "Directory to scan"
        required: false
        type: string
        default: "."

      image-name:
        description: "Docker image name to scan"
        required: false
        type: string
        default: ""

      run-trivy-image:
        description: "Whether to run Trivy image scanning"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reusable-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-directory }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Trivy Container Image Scan
    if: ${{ inputs.run-trivy-image && inputs.image-name != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image-name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
