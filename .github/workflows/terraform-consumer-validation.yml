name: Terraform Consumer Validation

on:
  pull_request:
    paths:
      - "infrastructure/modules/**"
      - "infrastructure/examples/**"
      - ".github/workflows/terraform-consumer-validation.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/modules/**"
      - "infrastructure/examples/**"
      - ".github/workflows/terraform-consumer-validation.yml"

permissions:
  contents: read

jobs:
  orders-api:
    name: Validate Orders API Consumer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/examples/orders-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/examples/orders-api
          framework: terraform
          quiet: true

  payments-api:
    name: Validate Payments API Consumer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/examples/payments-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/examples/payments-api
          framework: terraform
          quiet: true
