name: Repository Template Validation

on:
  pull_request:
    paths:
      - "repo-template/**"
      - ".github/workflows/template-validation.yml"

  push:
    branches:
      - main
    paths:
      - "repo-template/**"
      - ".github/workflows/template-validation.yml"

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: repo-template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./repo-template
          file: ./repo-template/Dockerfile
          push: false
          tags: acme-template:validation

  structure-validation:
    name: Template Structure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files and directories
        shell: bash
        run: |
          set -e

          required_paths=(
            "repo-template/app"
            "repo-template/tests"
            "repo-template/infrastructure"
            "repo-template/docs"
            "repo-template/architecture"
            "repo-template/ai-specifications"
            "repo-template/engineering-decisions"
            "repo-template/.github"
            "repo-template/.github/CODEOWNERS"
            "repo-template/Dockerfile"
            "repo-template/.dockerignore"
            "repo-template/.gitignore"
            "repo-template/README.md"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Missing required path: $path"
              exit 1
            fi
          done

          echo "Repository template structure validation passed."
