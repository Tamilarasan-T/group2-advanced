name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used for the application"
        required: false
        type: string
        default: "3.12"

      working-directory:
        description: "Application working directory"
        required: false
        type: string
        default: "app"

      run-tests:
        description: "Whether to execute application tests"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reusable-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping dependency installation."
          fi

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: |
          if [ -d tests ]; then
            if python -c "import pytest" 2>/dev/null; then
              python -m pytest tests -v
            else
              echo "Tests directory found but pytest is not installed."
              echo "Add pytest to requirements.txt to enable automated tests."
              exit 1
            fi
          else
            echo "No tests directory found. Skipping tests."
          fi
